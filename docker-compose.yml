services:
  postgres:
    image: postgres:16
    container_name: company-assistant-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: ${POSTGRES_DB:-company_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: company-assistant-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
